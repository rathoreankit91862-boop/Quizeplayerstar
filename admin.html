<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>👨‍💼 Admin Panel</h1>

<input type="text" id="adminName" placeholder="Admin Name">

<button onclick="createGame()">
🎮 Create Game
</button>

<h3 id="codeShow"></h3>

<hr>

<h2>📝 Add Questions</h2>

<textarea
id="questionsText"
rows="12"
style="width:100%;"
placeholder="Question:
Option1:
Option2:
Option3:
Option4:
Answer:"></textarea>

<button onclick="saveQuestions()">
💾 Save Questions
</button>

<button onclick="startGame()">
▶️ Start Game
</button>

<hr>

<h2>👥 Players Joined</h2>

<p>
Total Players:
<b id="playerCount">0</b>
</p>

<div id="playersBox">

No Players Joined

</div>

<hr>

<h2>🏆 Live Leaderboard</h2>

<div id="leaderboardBox">

No Scores Yet

</div>

<hr>

<h2>📊 Game Status</h2>

<div id="gameStatus">

Waiting...

</div>

<p id="adminMessage"></p>

</div>

<script type="module" src="admin.js"></script>

</body>

</html>
